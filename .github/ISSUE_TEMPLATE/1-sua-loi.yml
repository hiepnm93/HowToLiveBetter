name: "Sửa lỗi: mục viết sai hoặc đã cũ"
description: Số liệu không đúng, quy định đã đổi, nguồn không mở được, cách nói có chỗ sai
title: "Chương X mục Y:"
labels: ["sua-loi"]
body:
  - type: input
    id: where
    attributes:
      label: Mục nào
      description: Ghi số chương và số mục, ví dụ "chương 32 mục 2".
      placeholder: Chương X mục Y
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Chỗ nào không đúng
      description: Chép lại câu nguyên văn, rồi nói đúng phải là thế nào.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Căn cứ
      description: Bài báo tạp chí (DOI hoặc link PubMed), nguyên văn điều luật, trang của chính phủ hoặc cơ quan chính thức. Bài kể lại trên các nền tảng như Zhihu, tài khoản công chúng WeChat, Baijiahao không dùng được.
    validations:
      required: true
