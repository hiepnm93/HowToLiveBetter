name: Đề xuất bổ sung nội dung
description: Chủ đề sách chưa viết tới mà bạn thấy đáng thêm
labels: ["noi-dung-moi"]
body:
  - type: markdown
    attributes:
      value: Sách này chỉ nhận gợi ý trả lời được câu hỏi "bỏ ra cái gì, đổi lại được cái gì", nguồn chỉ trích bài báo tạp chí và văn bản chính thức. Bản dịch hãy tự duy trì trên fork của bạn, không hợp vào repo này, có thể thêm link ở đầu README.
  - type: input
    id: topic
    attributes:
      label: Chủ đề
      placeholder: "Ví dụ: xét chức danh nghề nghiệp thế nào"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Bạn muốn sách trả lời câu hỏi gì
      description: Viết cụ thể một chút, ví dụ "nên đến cơ quan nào, cần chuẩn bị giấy tờ gì".
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Nguồn bạn biết (không bắt buộc)
      description: Link bài báo, quy định, văn bản chính thức.
    validations:
      required: false
