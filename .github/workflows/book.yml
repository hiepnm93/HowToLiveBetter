# Nội dung vừa đổi là tự sinh lại cả ba thứ, gắn lên Release cố định "epub-latest", link tải không đổi:
#   EPUB        https://github.com/hiepnm93/HowToLiveBetter/releases/download/epub-latest/HowToLiveBetter.epub
#   PDF         https://github.com/hiepnm93/HowToLiveBetter/releases/download/epub-latest/HowToLiveBetter.pdf
#   HTML đơn file offline  https://github.com/hiepnm93/HowToLiveBetter/releases/download/epub-latest/HowToLiveBetter.html
# PR chỉ sinh và kiểm tra, không phát hành, sản phẩm nằm trong artifact ở trang Actions.
name: Sách điện tử

on:
  push:
    branches: [main]
    paths:
      - README.md
      - index.html
      - og.png
      - ads/**
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  pull_request:
    paths:
      - README.md
      - index.html
      - og.png
      - ads/**
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: '3.11'
  TYPST_VERSION: '0.15.1'

jobs:
  # Kiểm tra trích dẫn chéo. Job riêng, cố tình không gắn vào build: neo chưa bổ xong không nên
  # kéo lụy việc phát hành EPUB, PDF và HTML đơn file offline, đó là hai chuyện riêng.
  # Trên PR vẫn đỏ như thường, trên main đáng phát hành vẫn phát hành.
  # Đường chạy local (sync-stats.mjs) phải tự nhớ chạy mới chạy,
  # PR bên ngoài càng hoàn toàn không chạy tới, nên màn kiểm tra này phải có một bản trong CI. Không phụ thuộc, vài giây.
  refs:
    name: Kiểm tra trích dẫn chéo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-refs.mjs --check

  # Kiểm tra Hiểu nhanh: độ dài, biệt ngữ nghiên cứu, cách nói trừu tượng. Lý do như trên, job riêng, không chặn phát hành.
  plain:
    name: Kiểm tra Hiểu nhanh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-plain.mjs

  # Kiểm tra số liệu thống kê: số mục, số A/B/C, số liên kết... trong README, index.html, og.html có khớp với book/ không.
  # sync-stats.mjs chạy local phải tự nhớ chạy mới cập nhật, PR hợp nhất thẳng trên web hoàn toàn không qua nổi nó. Lý do như trên, không chặn phát hành.
  # Chỉ kiểm không sửa: bắt CI đẩy commit lên main sẽ lệch với bản local, hơn nữa Ubuntu không có font Microsoft YaHei nên chụp og.png sẽ sai.
  stats:
    name: Kiểm tra số liệu thống kê
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/sync-stats.mjs --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/epub/package-lock.json

      - run: npm ci
        working-directory: tools/epub

      - name: EPUB
        run: node tools/epub/build.mjs

      - name: HTML đơn file offline
        run: node tools/offline/build.mjs

      - name: Cài pandoc, typst và font tiếng Trung
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          curl -sSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" | tar xz
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar xJ
          echo "$PWD/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: PDF
        run: |
          typst fonts | grep -i -E 'noto (serif|sans) cjk' || echo 'Không thấy Noto CJK, PDF sẽ lùi sang font khác, xem lại bước fonts-noto-cjk'
          node tools/pdf/build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: epubcheck
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.4.0/epubcheck.jar dist/HowToLiveBetter.epub

      - uses: actions/upload-artifact@v4
        with:
          name: HowToLiveBetter
          path: |
            dist/HowToLiveBetter.epub
            dist/HowToLiveBetter.pdf
            dist/HowToLiveBetter.html

      - name: Phát hành lên Release epub-latest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f epub-latest
          git push -f origin epub-latest
          notes="Commit nội dung ${GITHUB_SHA::7}, sinh lúc $(date -u -d '+8 hours' +'%Y-%m-%d %H:%M') (giờ Bắc Kinh). Cả ba thứ EPUB, PDF, HTML đơn file offline tự sinh lại sau mỗi lần nội dung cập nhật, link tải cố định không đổi."
          if gh release view epub-latest >/dev/null 2>&1; then
            gh release edit epub-latest --title "Sách điện tử (EPUB / PDF / HTML offline, tự động cập nhật)" --notes "$notes"
          else
            gh release create epub-latest --title "Sách điện tử (EPUB / PDF / HTML offline, tự động cập nhật)" --notes "$notes" --latest=false
          fi
          gh release upload epub-latest \
            dist/HowToLiveBetter.epub \
            dist/HowToLiveBetter.pdf \
            dist/HowToLiveBetter.html --clobber
