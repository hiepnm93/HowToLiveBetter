<!-- File nguồn của ads/mcyyy.webp (tấm banner trong phần "Vị trí quảng cáo" ở cuối README). Sửa xong thì xuất lại ảnh (Windows + Chrome):
     "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless --disable-gpu ^
       --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,400 ^
       --screenshot=D:\projects\HowToLiveBetter\ads\mcyyy.png ^
       D:\projects\HowToLiveBetter\tools\ad-mcyyy.html
     Chrome chỉ xuất được png (khoảng 540KB), đổi tiếp sang webp (khoảng 55KB) rồi xóa png, phần chuyển dùng sharp trong mcyyy-next:
       cd D:\projects\mcyyy-next
       node -e "require('sharp')('D:/projects/HowToLiveBetter/ads/mcyyy.png').webp({quality:84}).toFile('D:/projects/HowToLiveBetter/ads/mcyyy.webp')"
     Chụp ảnh phải dùng đường dẫn tuyệt đối, đường dẫn tương đối thì headless báo "hệ thống không tìm thấy đường dẫn đã chỉ định".
     Ảnh nền tools/ad-mcyyy-bg.webp lấy từ chính trang chủ của máy chủ, đổi quảng cáo thì chép cả phần này ra sửa. -->
<!doctype html><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:400px;font-family:"Be Vietnam Pro","Inter",sans-serif;
  position:relative;overflow:hidden;background:#0b1220}
.bg{position:absolute;inset:0;background:url("ad-mcyyy-bg.webp") center 42% / cover no-repeat}
.scrim{position:absolute;inset:0;
  background:linear-gradient(100deg, rgba(8,15,32,.94) 0%, rgba(8,15,32,.86) 38%, rgba(8,15,32,.45) 64%, rgba(8,15,32,.15) 100%)}
.in{position:relative;height:100%;padding:44px 56px;display:flex;flex-direction:column;justify-content:center;color:#fff}
.kicker{font-size:19px;letter-spacing:.34em;color:#9fc0ff;font-weight:600}
h1{margin-top:14px;font-size:76px;line-height:1;letter-spacing:.04em;font-weight:700;
  text-shadow:0 4px 26px rgba(0,0,0,.55)}
.sub{margin-top:16px;font-size:25px;color:#dbe6ff;font-weight:500}
.chips{margin-top:24px;display:flex;gap:11px}
.c{font-size:18px;font-weight:600;padding:9px 17px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#eaf1ff}
.addr{margin-top:28px;display:flex;align-items:center;gap:18px}
.ip{font-size:32px;font-weight:700;letter-spacing:.02em;padding:11px 24px;border-radius:12px;
  background:#3451b2;box-shadow:0 8px 28px rgba(52,81,178,.45)}
.ip span{font-size:19px;font-weight:600;opacity:.82;margin-right:12px;letter-spacing:.06em}
.site{font-size:21px;color:#c3d4f5;font-weight:500}
</style>
<div class="bg"></div>
<div class="scrim"></div>
<div class="in">
  <div class="kicker">MÁY CHỦ SINH TỒN MINECRAFT JAVA</div>
  <h1>Thế giới Vĩnh Hằng</h1>
  <div class="sub">Nhân đa luồng Folia, đông người vẫn mượt; lối chơi tu tiên mcMMO</div>
  <div class="chips">
    <div class="c">Lãnh địa · Kinh tế · Dịch chuyển</div>
    <div class="c">Sao lưu toàn máy chủ mỗi giờ</div>
    <div class="c">Sinh tồn thuần khiết</div>
  </div>
  <div class="addr">
    <div class="ip"><span>Địa chỉ chơi</span>1.mcyyy.com</div>
    <div class="site">Trang chủ 4.mcyyy.com</div>
  </div>
</div>
